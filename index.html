<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Appel du Père Noël</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="snow"></div>

<main class="phone">

  <section id="screen-setup" class="screen">
    <div class="card">
      <div class="santa-badge">🎅</div>
      <h1>Appel du Père Noël</h1>
      <p class="subtitle">Prépare un petit appel surprise avec le Père Noël !</p>

      <label class="field">
        <span>Prénom de l'enfant</span>
        <input id="childName" type="text" value="Léo" maxlength="20">
      </label>

      <button id="btnStartCall" class="btn btn-primary btn-big">📞 Appeler le Père Noël</button>
      <p class="hint">Astuce : utilise le haut-parleur et tiens le téléphone pour que l'enfant voie l'écran.</p>
    </div>
  </section>

  <section id="screen-incoming" class="screen hidden">
    <div class="card incoming">
      <div class="santa-avatar ringing">🎅</div>
      <h2 id="incomingCallerName">Père Noël</h2>
      <p class="ringing-label">Appel entrant…</p>
      <div class="call-actions">
        <button id="btnDecline" class="btn btn-round btn-decline" aria-label="Refuser">✖</button>
        <button id="btnAnswer" class="btn btn-round btn-answer" aria-label="Répondre">📞</button>
      </div>
    </div>
  </section>

  <section id="screen-call" class="screen hidden">
    <div class="card call">
      <div class="call-header">
        <div class="santa-avatar small" id="santaAvatar">🎅</div>
        <div>
          <h2>Père Noël</h2>
          <span id="callTimer" class="timer">00:00</span>
        </div>
      </div>

      <div class="caption-box">
        <p id="captionText">…</p>
      </div>

      <div id="answerZone" class="answer-zone"></div>

      <div class="call-footer">
        <button id="btnReplay" class="btn btn-ghost" title="Réécouter">🔊 Réécouter</button>
        <button id="btnHangup" class="btn btn-round btn-decline" aria-label="Raccrocher">📞</button>
      </div>
    </div>
  </section>

  <section id="screen-summary" class="screen hidden">
    <div class="card summary">
      <div class="santa-badge">🎄</div>
      <h1>Résumé de l'appel</h1>
      <ul id="summaryList" class="summary-list"></ul>
      <button id="btnNewCall" class="btn btn-primary btn-big">📞 Nouvel appel</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
